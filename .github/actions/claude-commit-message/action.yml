name: Claude commit message
description: >-
  Stage all changes and summarise the staged diff as a commit message with Claude.
  Authenticates with GitHub OIDC via Anthropic Workload Identity Federation, so no API key is stored.
  Never fails the job: on any error the message output is empty and callers should fall back.
  Reads ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID
  and optional ANTHROPIC_WORKSPACE_ID from the job env.

inputs:
  model:
    description: Claude model ID
    default: claude-opus-5-5
  max-diff-bytes:
    description: Diff bytes sent to Claude. Larger diffs are cut and Claude is told so; the full --stat is always sent
    default: "400000"

outputs:
  changed:
    description: "'true' if there are staged changes"
    value: ${{ steps.claude.outputs.changed }}
  message:
    description: Generated commit message, empty on failure
    value: ${{ steps.claude.outputs.message }}

runs:
  using: composite
  steps:
    - id: claude
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
      run: |
        set -uo pipefail
        dir="$RUNNER_TEMP/claude-commit"
        mkdir -p "$dir"

        git add -A
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"

        fail() { echo "::warning::Claude commit message skipped: $*"; exit 0; }

        for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
          [ -n "${!v:-}" ] || fail "$v is not set"
        done
        [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || fail "job needs 'permissions: id-token: write'"

        # prompt: full stat, then the diff (cut at MAX_DIFF_BYTES so huge decompile diffs stay bounded)
        git diff --cached --stat=200 > "$dir/stat"
        git diff --cached > "$dir/diff"
        size=$(wc -c < "$dir/diff")
        {
          echo "<diffstat>"
          cat "$dir/stat"
          echo "</diffstat>"
          if [ "$size" -gt "$MAX_DIFF_BYTES" ]; then
            echo "<note>The diff is $size bytes and was cut to the first $MAX_DIFF_BYTES bytes. Use the diffstat for files not shown.</note>"
          fi
          echo "<diff>"
          head -c "$MAX_DIFF_BYTES" "$dir/diff"
          echo
          echo "</diff>"
        } > "$dir/prompt"

        # GitHub OIDC token -> short-lived Anthropic token
        jwt=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value) \
          || fail "GitHub OIDC token request failed"
        echo "::add-mask::$jwt"

        exchange=$(jq -n --arg jwt "$jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: $jwt,
            federation_rule_id: env.ANTHROPIC_FEDERATION_RULE_ID,
            organization_id: env.ANTHROPIC_ORGANIZATION_ID,
            service_account_id: env.ANTHROPIC_SERVICE_ACCOUNT_ID
          } + (if (env.ANTHROPIC_WORKSPACE_ID // "") != "" then {workspace_id: env.ANTHROPIC_WORKSPACE_ID} else {} end)' \
          | curl -sS https://api.anthropic.com/v1/oauth/token -H "content-type: application/json" --data-binary @-)
        token=$(jq -r '.access_token // empty' <<< "$exchange")
        [ -n "$token" ] || fail "token exchange failed (see Claude Console > Workload identity > history): $(jq -c '.error // .' <<< "$exchange")"
        echo "::add-mask::$token"

        # server-side refusal fallback only exists for these models
        case "$MODEL" in
          claude-fable-5-1|claude-opus-5-5|claude-opus-5|claude-sonnet-5-5) fallbacks=true ;;
          *) fallbacks=false ;;
        esac

        jq -n --arg model "$MODEL" --rawfile prompt "$dir/prompt" --argjson fallbacks "$fallbacks" '{
            model: $model,
            max_tokens: 16000,
            output_config: {effort: "low"},
            system: "You write git commit messages for an automated repository that tracks changes to scraped vendor data and decompiled code. Given a staged diff, reply with only the commit message: a specific one-line summary under 72 characters, a blank line, then one line per notable change starting with \"- \". Name the concrete things that changed (versions, endpoints, settings, files). Avoid generic phrases like \"updated configuration files\". Do not use markdown formatting or add any other text.",
            messages: [{role: "user", content: $prompt}]
          } + (if $fallbacks then {fallbacks: "default"} else {} end)' > "$dir/request.json"

        curl -sS https://api.anthropic.com/v1/messages \
          -H "authorization: Bearer $token" \
          -H "anthropic-version: 2023-06-01" \
          -H "anthropic-beta: server-side-fallback-2026-07-01" \
          -H "content-type: application/json" \
          --data-binary "@$dir/request.json" > "$dir/response.json" \
          || fail "Messages API request failed"

        stop=$(jq -r '.stop_reason // empty' "$dir/response.json")
        [ "$stop" = "end_turn" ] || fail "stop_reason=${stop:-none}: $(jq -c '.error // .stop_details // empty' "$dir/response.json")"
        message=$(jq -r '[.content[] | select(.type == "text") | .text] | join("")' "$dir/response.json" | sed -e 's/[[:space:]]*$//')
        [ -n "$message" ] || fail "empty response"

        delim="EOF_$(openssl rand -hex 8)"
        { echo "message<<$delim"; echo "$message"; echo "$delim"; } >> "$GITHUB_OUTPUT"
