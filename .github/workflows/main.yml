name: Refresh data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # hourly
  push:

jobs:
  main:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write # Graph and Claude auth
      contents: write # committing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # azure-identity doesn't support GitHub WIF
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
          cache: pip

      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GH_PAT }} # permissions.secrets doesn't exist, so use a fine-grained PAT
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CHANGEMGMT_RT: ${{ secrets.AZURE_CHANGEMGMT_RT }}
          AZURE_INTUNEPORTAL_RT: ${{ secrets.AZURE_INTUNEPORTAL_RT }}
          AZURE_OCPS_RT: ${{ secrets.AZURE_OCPS_RT }}
          AZURE_TEAMS_RT: ${{ secrets.AZURE_TEAMS_RT }}

      - id: summary
        # push runs keep the static message
        if: github.event_name != 'push'
        uses: ./.github/actions/claude-commit-message
      - uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11.1.1
        with:
          default_author: github_actions
          message: "data: ${{ steps.summary.outputs.message || 'change detected' }}"
